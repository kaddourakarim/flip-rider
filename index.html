<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip Rider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2140; --panel:#262e57; --ink:#fff7e6; --accent:#ffcc33; --accent-dark:#c2410c; --muted:#aab3e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
  header{text-align:center;padding:18px 16px 4px}
  h1{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:clamp(34px,6vw,58px);margin:0;color:var(--accent);
     letter-spacing:1px;text-shadow:0 4px 0 var(--accent-dark),0 8px 18px rgba(0,0,0,.35)}
  .tag{color:var(--muted);margin:4px 0 0;font-weight:700}
  main{max-width:1240px;margin:0 auto;padding:12px 16px 28px}
  #wrap{width:100%;display:flex;justify-content:center}
  canvas{display:block;border-radius:16px;border:4px solid #0f1430;background:#7fd1ff;
         box-shadow:0 10px 0 #10142b,0 20px 40px rgba(0,0,0,.4);outline:none}
  .keys{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
  .key{background:var(--panel);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}
  kbd{font-family:'Lilita One',system-ui,sans-serif;background:var(--ink);color:var(--bg);border-radius:9px;padding:3px 12px;font-size:24px;
      box-shadow:0 4px 0 #8f97c2;min-width:44px;text-align:center}
  .note{color:var(--muted);text-align:center;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>FLIP RIDER</h1>
  <p class="tag">Ride the hills · do flips · win the cup!</p>
</header>
<main>
  <div id="wrap"><canvas id="game" tabindex="0" aria-label="Flip Rider game"></canvas></div>
  <div class="keys">
    <div class="key"><kbd>↑</kbd> Go!</div>
    <div class="key"><kbd>↓</kbd> Brake</div>
    <div class="key"><kbd>←</kbd> Backflip</div>
    <div class="key"><kbd>→</kbd> Frontflip</div>
  </div>
  <p class="note">Hold the arrows, don't tap. Rider's head touches the ground = oops, back to the last flag. M = sound on/off · Esc = menu</p>
</main>

<script>
(() => {
'use strict';

/* ================= canvas ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VIEW_H = 620;               // world units visible vertically
let W = 0, H = 0, SCALE = 1;
function resize() {
  const wrap = document.getElementById('wrap');
  let w = Math.max(320, wrap.clientWidth), h = w * 9 / 16;
  const maxH = Math.max(240, window.innerHeight * 0.72);
  if (h > maxH) { h = maxH; w = h * 16 / 9; }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  W = canvas.width; H = canvas.height; SCALE = H / VIEW_H;
}
window.addEventListener('resize', resize); resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('wrap'));

/* ================= storage ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('fliprider.best', {});

/* ================= levels =================
   pts: [x, y, 'k'?]  y grows downward. 'k' = sharp corner (ramp lip).
   stars: [x, heightAboveGround]  */
const LEVELS = [
  { name: 'Sunny Hills', par: 14, silver: 1300, gold: 1900, startX: 100,
    pts: [[-700,-700,'k'],[-600,400,'k'],[0,400],[500,400],[800,365],[1100,400],[1500,345],[1900,400],[2300,400],
          [2490,350],[2560,308,'k'],[3400,640],[3750,650],[4100,650],[4400,610],[4700,650],[5300,650,'k'],[5400,-600,'k']],
    checkpoints: [1800, 3700], stars: [[800,60],[1500,70],[2800,200],[3050,120],[4400,60]], finish: 5000 },
  { name: 'Jump Park', par: 20, silver: 1900, gold: 2900, startX: 100,
    pts: [[-700,-600,'k'],[-600,300,'k'],[0,300],[600,300],[1000,330],[1200,330],[1400,270],[1460,232,'k'],[2200,560],
          [2600,580],[2800,520],[2860,482,'k'],[3600,810],[4000,830],[4200,770],[4260,732,'k'],[5000,1060],[5400,1080],
          [6000,1080,'k'],[6100,-100,'k']],
    checkpoints: [700, 2350, 3750, 5300], stars: [[1200,50],[1750,230],[2600,50],[3150,240],[4000,50],[4550,240],[5600,50]], finish: 5700 },
  { name: 'Big Mountain', par: 22, silver: 2400, gold: 3600, startX: 100,
    pts: [[-700,-900,'k'],[-600,0,'k'],[0,0],[300,0],[900,280],[1300,400],[1550,400],[1800,330],[1870,285,'k'],
          [2900,860],[3300,900],[3700,900],[3950,830],[4020,782,'k'],[5100,1360],[5800,1700],[6100,1640],
          [6175,1570,'k'],[7900,2700],[8300,2730],[8900,2730,'k'],[9000,1700,'k']],
    checkpoints: [1000, 3150, 5300, 8200], stars: [[600,60],[1550,50],[2300,300],[2600,200],[3500,50],[4500,320],[4800,200],[6900,450],[7400,300]], finish: 8600 },
];

/* ================= terrain ================= */
let ground = [];
function buildTerrain(pts) {
  const n = pts.length, out = [];
  const seg = i => (pts[i+1][1] - pts[i][1]) / (pts[i+1][0] - pts[i][0]);
  // tangent (slope) arriving at / leaving point i
  const smooth = i => {
    if (i === 0) return seg(0);
    if (i === n - 1) return seg(n - 2);
    const a = seg(i - 1), b = seg(i);
    return a * b <= 0 ? 0 : (a + b) / 2;
  };
  const mIn  = i => pts[i][2] === 'k' ? seg(i - 1) : smooth(i);
  const mOut = i => pts[i][2] === 'k' ? seg(i) : smooth(i);
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], dx = x1 - x0;
    const m0 = mOut(i) * dx, m1 = mIn(i + 1) * dx;
    const steps = Math.max(2, Math.ceil(Math.hypot(dx, y1 - y0) / 22));
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const y = (2*t3 - 3*t2 + 1) * y0 + (t3 - 2*t2 + t) * m0 + (-2*t3 + 3*t2) * y1 + (t3 - t2) * m1;
      out.push({ x: x0 + dx * t, y });
    }
  }
  out.push({ x: pts[n-1][0], y: pts[n-1][1] });
  return out;
}
function segIndex(x) {
  let lo = 0, hi = ground.length - 2;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ground[mid].x <= x) lo = mid; else hi = mid - 1; }
  return lo;
}
function groundY(x) {
  const i = segIndex(x), a = ground[i], b = ground[i + 1];
  const t = Math.max(0, Math.min(1, (x - a.x) / (b.x - a.x)));
  return a.y + (b.y - a.y) * t;
}
// push circle out of the ground; returns contact normal or null
function collideCircle(p, r) {
  let hit = null;
  for (let pass = 0; pass < 2; pass++) {
    const i = segIndex(p.x);
    let bestD = Infinity, bx = 0, by = 0, bnx = 0, bny = -1;
    for (let j = Math.max(0, i - 8); j <= Math.min(ground.length - 2, i + 8); j++) {
      const a = ground[j], b = ground[j + 1];
      const ex = b.x - a.x, ey = b.y - a.y, L2 = ex*ex + ey*ey;
      let t = ((p.x - a.x) * ex + (p.y - a.y) * ey) / L2; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = a.x + ex * t, cy = a.y + ey * t, d = Math.hypot(p.x - cx, p.y - cy);
      if (d < bestD) { const L = Math.sqrt(L2); bestD = d; bx = cx; by = cy; bnx = ey / L; bny = -ex / L; }
    }
    let nx, ny, pen;
    if (bestD > 1e-6) { nx = (p.x - bx) / bestD; ny = (p.y - by) / bestD; } else { nx = bnx; ny = bny; }
    if (nx * bnx + ny * bny < 0) { nx = -nx; ny = -ny; pen = r + bestD; }   // we are below the surface
    else pen = r - bestD;
    if (pen > -0.6) {
      if (pen > 0) { p.x += nx * pen; p.y += ny * pen; }
      hit = { x: nx, y: ny };
    } else break;
  }
  return hit;
}

/* ================= tuning (kid friendly) ================= */
const T = {
  GRAV: 800, ACC: 600, MAXV: 700, ROLL: 0.25, BRAKE: 5, DRAG: 0.9997,
  AIR_ALPHA: 16, AIR_MAXW: 6.6, AIR_DAMP: 8, AIR_ASSIST: 10,  // spin accel, max spin (rad/s), no-key damping + landing assist
  GND_ALPHA: 7,  GND_MAXW: 2.6, ASSIST: 3.5,         // on-ground lean + auto-straighten
  ROT_RAMP: 4, GAS_RAMP: 3,                          // how fast keys "ease in" (per second)
  FLIP_SLACK: 0.9,                                   // ~50° forgiveness on a flip
};
const WR = 18, HR = 12, DT = 1 / 120;
const SHAPE = [ {a:-35,u:0,m:1}, {a:35,u:0,m:1}, {a:-6,u:62,m:0.6} ];  // rear wheel, front wheel, head
const LINKS = [[0,1],[0,2],[1,2]].map(([i,j]) => [i, j, Math.hypot(SHAPE[i].a - SHAPE[j].a, SHAPE[i].u - SHAPE[j].u)]);

/* ================= state ================= */
let state = 'menu';         // menu | ready | play | finish
let sel = 0, L = null, parts = [], run = null, cam = { x: 0, y: 0 };
let menuCamX = 0, finishInfo = null, confetti = [], stateT = 0;

function placeBike(x) {
  const xr = x - 35, xf = x + 35;
  const yr = groundY(xr) - WR - 1, yf = groundY(xf) - WR - 1;
  const dx = xf - xr, dy = yf - yr, len = Math.hypot(dx, dy);
  const d = { x: dx / len, y: dy / len }, up = { x: d.y, y: -d.x };
  const mx = (xr + xf) / 2, my = (yr + yf) / 2;
  parts = SHAPE.map(s => {
    const px = mx + d.x * s.a + up.x * s.u, py = my + d.y * s.a + up.y * s.u;
    return { x: px, y: py, px, py, m: s.m, w: 1 / s.m, n: null };
  });
  if (run) { run.lastA = Math.atan2(dy, dx); run.airT = 0; run.airRot = 0; run.pending = null; run.rot = 0; run.gas = 0; }
}

function loadLevel(i) {
  L = LEVELS[i]; sel = i;
  ground = buildTerrain(L.pts);
  run = { time: 0, started: false, finished: false, crashed: false, crashT: 0, crashes: 0,
          cp: L.startX, cpHit: L.checkpoints.map(() => false), stars: L.stars.map(() => false), starCount: 0,
          flipPts: 0, backflips: 0, frontflips: 0, popups: [], rot: 0, gas: 0,
          lastA: 0, airT: 0, airRot: 0, pending: null, spinR: 0, spinF: 0, speed: 0 };
  placeBike(L.startX);
  const c = center(); cam.x = c.x + 150; cam.y = c.y - 60;
  confetti = [];
}

function center() {
  let x = 0, y = 0, M = 0;
  for (const p of parts) { x += p.x * p.m; y += p.y * p.m; M += p.m; }
  return { x: x / M, y: y / M };
}
const approach = (v, t, s) => v < t ? Math.min(t, v + s) : Math.max(t, v - s);

/* ================= physics ================= */
function physicsStep(dt) {
  const [R, F, Hd] = parts;
  const ctrl = state === 'play' && !run.crashed && !run.finished;
  const tgtRot = ctrl ? ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) : 0;
  run.rot = approach(run.rot, tgtRot, dt * (tgtRot === 0 ? 12 : T.ROT_RAMP));   // ease in slowly, let go fast
  run.gas = approach(run.gas, ctrl && keys.ArrowUp ? 1 : 0, dt * T.GAS_RAMP);
  const brake = ctrl && keys.ArrowDown;
  const air = !R.n && !F.n;

  // gas: push rear wheel along the ground
  if (run.gas > 0 && R.n) {
    const tx = -R.n.y, ty = R.n.x;
    const vt = ((R.x - R.px) * tx + (R.y - R.py) * ty) / dt;
    if (vt < T.MAXV) { const a = T.ACC * run.gas * dt * dt; for (const p of parts) { p.px -= tx * a; p.py -= ty * a; } }
  }

  // lean / spin
  const c = center();
  let Lm = 0, I = 0;
  for (const p of parts) {
    const rx = p.x - c.x, ry = p.y - c.y, vx = (p.x - p.px) / dt, vy = (p.y - p.py) / dt;
    Lm += p.m * (rx * vy - ry * vx); I += p.m * (rx * rx + ry * ry);
  }
  const w = Lm / I;     // + = clockwise on screen = nose down (frontflip)
  let dw = 0;
  if (Math.abs(run.rot) > 0.01) {
    const alpha = air ? T.AIR_ALPHA : T.GND_ALPHA, maxW = air ? T.AIR_MAXW : T.GND_MAXW;
    dw = run.rot * alpha * dt;
    if (dw > 0) dw = Math.min(dw, Math.max(0, maxW - w)); else dw = Math.max(dw, Math.min(0, -maxW - w));
  } else if (air) {
    // landing assist: settle spin and turn gently toward the slope below
    const slope = Math.atan2(groundY(c.x + 30) - groundY(c.x - 30), 60);
    let err = Math.atan2(F.y - R.y, F.x - R.x) - slope;
    err = Math.atan2(Math.sin(err), Math.cos(err));
    dw = (-err * T.AIR_ASSIST - w * T.AIR_DAMP) * dt;
  } else {
    // auto-straighten relative to the ground under the bike
    const n = (R.n || F.n), tx = -n.y, ty = n.x;
    const dx = F.x - R.x, dy = F.y - R.y;
    const tilt = Math.atan2(tx * dy - ty * dx, tx * dx + ty * dy);   // - = nose up
    if (Math.abs(tilt) > 0.25) dw = (-(tilt - Math.sign(tilt) * 0.25) * T.ASSIST - w * 0.8) * dt;
  }
  if (dw) for (const p of parts) { const rx = p.x - c.x, ry = p.y - c.y; p.px += ry * dw * dt; p.py -= rx * dw * dt; }

  // integrate
  const g = T.GRAV * dt * dt;
  for (const p of parts) {
    const vx = (p.x - p.px) * T.DRAG, vy = (p.y - p.py) * T.DRAG;
    p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + g;
  }

  // constraints + collisions
  R.n = F.n = null; let headHit = false;
  for (let it = 0; it < 6; it++) {
    for (const [i, j, len] of LINKS) {
      const a = parts[i], b = parts[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-6;
      const k = (d - len) / d / (a.w + b.w);
      a.x += dx * k * a.w; a.y += dy * k * a.w; b.x -= dx * k * b.w; b.y -= dy * k * b.w;
    }
    const nr = collideCircle(R, WR); if (nr) R.n = nr;
    const nf = collideCircle(F, WR); if (nf) F.n = nf;
    if (collideCircle(Hd, HR)) headHit = true;
  }

  // wheel contact response: no bounce, rolling resistance, brake
  for (const p of [R, F]) {
    if (!p.n) continue;
    const n = p.n, vx = p.x - p.px, vy = p.y - p.py, vn = vx * n.x + vy * n.y;
    let tx = vx - n.x * vn, ty = vy - n.y * vn;
    const f = brake ? Math.max(0, 1 - T.BRAKE * dt) : 1 - T.ROLL * dt;
    tx *= f; ty *= f;
    const keepN = vn > 0 ? vn * 0.5 : 0;
    p.px = p.x - (tx + n.x * keepN); p.py = p.y - (ty + n.y * keepN);
  }
  // keep speed sane
  for (const p of parts) {
    const vx = p.x - p.px, vy = p.y - p.py, v = Math.hypot(vx, vy), maxv = 1300 * dt;
    if (v > maxv) { p.px = p.x - vx / v * maxv; p.py = p.y - vy / v * maxv; }
  }

  // wheel spin (for drawing)
  const dx = F.x - R.x, dy = F.y - R.y, dl = Math.hypot(dx, dy);
  const along = ((R.x - R.px) * dx + (R.y - R.py) * dy) / dl;
  run.spinR += (R.n || run.gas > 0.3 ? along + (R.n ? 0 : run.gas * 6) : along * 0.3) / WR;
  run.spinF += along / WR;
  run.speed = Math.hypot(R.x - R.px, R.y - R.py) / dt;

  // crash?
  if (headHit && ctrl) {
    run.crashed = true; run.crashT = 1.2; run.crashes++; run.pending = null;
    addPopup('Oops!', '#ffffff', Hd.x, Hd.y - 30);
    sfx([300, 200, 120], 0.16, 'square', 0.07);
  }

  // flips
  const a = Math.atan2(dy, dx);
  let da = a - run.lastA; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
  run.lastA = a;
  const airNow = !R.n && !F.n;
  if (airNow) { run.airT += dt; run.airRot += da; }
  else {
    if (run.airT > 0.25 && !run.crashed && ctrl) {
      const n = Math.floor((Math.abs(run.airRot) + T.FLIP_SLACK) / (2 * Math.PI));
      if (n > 0) run.pending = { n, back: run.airRot < 0, t: 0.3 };
    }
    run.airT = 0; run.airRot = 0;
  }
  if (run.pending) {
    if (run.crashed) run.pending = null;
    else if ((run.pending.t -= dt) <= 0) { awardFlip(run.pending); run.pending = null; }
  }
}

function awardFlip({ n, back }) {
  const pts = 300 * n + (n > 1 ? 300 * (n - 1) : 0);
  run.flipPts += pts;
  if (back) run.backflips += n; else run.frontflips += n;
  const name = (n === 1 ? '' : n === 2 ? 'DOUBLE ' : n === 3 ? 'TRIPLE ' : n + 'x ') + (back ? 'BACKFLIP!' : 'FRONTFLIP!');
  const c = center();
  addPopup(name + '  +' + pts, back ? '#ffcc33' : '#7cf0ff', c.x, c.y - 90);
  sfx([523, 659, 784, 1047].slice(0, 2 + Math.min(2, n)), 0.12, 'triangle', 0.09);
}
function addPopup(text, color, x, y) { run.popups.push({ text, color, x, y, t: 0 }); }

/* ================= game flow ================= */
function update(dt) {
  stateT += dt;
  if (pressed.Escape && state !== 'menu') { state = 'menu'; stateT = 0; loadLevel(sel); }
  if (pressed.KeyM) muted = !muted;

  if (state === 'menu') {
    if (pressed.ArrowLeft)  { sel = (sel + LEVELS.length - 1) % LEVELS.length; loadLevel(sel); sfx([440], 0.06); }
    if (pressed.ArrowRight) { sel = (sel + 1) % LEVELS.length; loadLevel(sel); sfx([440], 0.06); }
    if (pressed.ArrowUp && stateT > 0.2) { loadLevel(sel); state = 'ready'; stateT = 0; sfx([523, 784], 0.08); }
    menuCamX += dt * 120;
  }

  if (state === 'ready' && keys.ArrowUp && stateT > 0.3) { state = 'play'; run.started = true; stateT = 0; }

  if (state === 'ready' || state === 'play' || state === 'finish') {
    let acc = (update.acc || 0) + dt, steps = 0;
    while (acc >= DT && steps < 10) { physicsStep(DT); acc -= DT; steps++; }
    update.acc = acc;
  }

  if (state === 'play') {
    if (!run.crashed) run.time += dt;
    const c = center();
    // checkpoints
    L.checkpoints.forEach((x, i) => {
      if (!run.cpHit[i] && c.x > x && !run.crashed) { run.cpHit[i] = true; run.cp = x; addPopup('Checkpoint!', '#b6ff8a', x, groundY(x) - 140); sfx([660, 880], 0.08, 'triangle'); }
    });
    // stars
    L.stars.forEach(([sx, sh], i) => {
      if (run.stars[i] || run.crashed) return;
      const sy = groundY(sx) - sh;
      if (parts.some(p => Math.hypot(p.x - sx, p.y - sy) < 36)) {
        run.stars[i] = true; run.starCount++; addPopup('+100', '#ffe066', sx, sy - 30); sfx([988, 1319], 0.07, 'square', 0.05);
      }
    });
    if (run.crashed && (run.crashT -= dt) <= 0) { run.crashed = false; placeBike(run.cp); }
    if (!run.crashed && c.x >= L.finish) finishRace();
  }

  if (state === 'finish') {
    if (stateT > 1.5) {
      if (pressed.ArrowUp) { loadLevel(sel); state = 'ready'; stateT = 0; }
      else if (pressed.ArrowRight && sel < LEVELS.length - 1) { loadLevel(sel + 1); state = 'ready'; stateT = 0; }
      else if (pressed.ArrowLeft) { state = 'menu'; stateT = 0; loadLevel(sel); }
    }
    for (const c of confetti) { c.vy += 300 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.r += c.vr * dt; }
  }

  // popups
  if (run) { for (const p of run.popups) p.t += dt; run.popups = run.popups.filter(p => p.t < 1.6); }

  // camera
  if (state !== 'menu') {
    const c = center();
    const vx = (parts[0].x - parts[0].px) / DT;
    const tx = c.x + 90 + Math.max(-80, Math.min(140, vx * 0.2)), ty = c.y - 40;
    const k = 1 - Math.exp(-dt * 4);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  } else {
    const span = L.finish - L.startX;
    cam.x = L.startX + 300 + (menuCamX % span);
    cam.y += ((groundY(cam.x) - 120) - cam.y) * (1 - Math.exp(-dt * 2));
  }
  updateEngine();
  for (const k in pressed) delete pressed[k];
}

function finishRace() {
  run.finished = true; state = 'finish'; stateT = 0;
  const timePts = Math.max(0, Math.round(1000 * (2 - run.time / L.par)));
  const starPts = run.starCount * 100;
  const total = timePts + run.flipPts + starPts;
  const cup = total >= L.gold ? 'gold' : total >= L.silver ? 'silver' : 'bronze';
  const prev = best[L.name];
  const isBest = !prev || total > prev.score;
  if (isBest) { best[L.name] = { score: total, cup }; store.set('fliprider.best', best); }
  finishInfo = { timePts, starPts, flipPts: run.flipPts, total, cup, isBest };
  confetti = [];
  for (let i = 0; i < 140; i++) confetti.push({ x: Math.random(), y: -Math.random() * 0.6, vx: (Math.random() - 0.5) * 0.25, vy: Math.random() * 0.2,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: ['#ffcc33','#ff6b3d','#7cf0ff','#b6ff8a','#ff7eb6','#ffffff'][i % 6] });
  sfx([523, 659, 784, 1047, 1319], 0.16, 'triangle', 0.1);
}

/* ================= input ================= */
const keys = {}, pressed = {};
const GAME_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ================= sound ================= */
let AC = null, eng = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 60; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(AC.destination); o.start();
    eng = { o, g };
  } catch (e) { AC = null; }
}
function sfx(freqs, dur, type = 'square', vol = 0.06) {
  if (!AC || muted) return;
  let t = AC.currentTime;
  for (const fr of freqs) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    t += dur * 0.7;
  }
}
function updateEngine() {
  if (!eng) return;
  const on = !muted && (state === 'play' || state === 'ready') && run && !run.crashed;
  const t = AC.currentTime;
  eng.g.gain.setTargetAtTime(on ? 0.025 + run.gas * 0.025 : 0, t, 0.08);
  eng.o.frequency.setTargetAtTime(48 + Math.min(run ? run.speed : 0, 900) * 0.07 + (run ? run.gas : 0) * 30, t, 0.08);
}

/* ================= drawing ================= */
const COL = {
  skyTop: '#5ab8f5', skyBot: '#d6f1ff', sun: '#fff1a8', cloud: '#ffffff',
  hillFar: '#a8dba0', hillNear: '#7cc47a', grass: '#3fae4a', grassLight: '#7be37f', dirt: '#8b5a2b', dirtDark: '#6e4420',
  frame: '#ff5a36', frameDark: '#b8361c', tire: '#23232b', rim: '#c9d1e0', shirt: '#2e86de', pants: '#24356b', helmet: '#ffcc33', visor: '#1b2140', skin: '#f2c39b',
};
const FONT = "'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif";

let dirtPattern = null;
function getDirtPattern() {
  if (dirtPattern) return dirtPattern;
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = COL.dirt; g.fillRect(0, 0, 64, 64);
  g.fillStyle = COL.dirtDark;
  [[8,10,4],[40,6,3],[24,30,5],[52,40,4],[12,50,3],[36,54,2],[58,20,2]].forEach(([x,y,r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  return (dirtPattern = ctx.createPattern(c, 'repeat'));
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, COL.skyTop); sky.addColorStop(1, COL.skyBot);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = COL.sun; ctx.beginPath(); ctx.arc(W * 0.83, H * 0.17, H * 0.07, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(W * 0.83, H * 0.17, H * 0.1, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  // clouds (parallax)
  ctx.fillStyle = COL.cloud;
  for (let i = 0; i < 6; i++) {
    const span = W + 400 * SCALE;
    const x = ((i * 523 - cam.x * 0.15) * SCALE % span + span) % span - 200 * SCALE;
    const y = H * (0.1 + (i % 3) * 0.09);
    cloud(x, y, SCALE * (0.8 + (i % 2) * 0.4));
  }
  // far + near hills
  hills(0.25, H * 0.62, H * 0.09, 0.0021, COL.hillFar);
  hills(0.45, H * 0.72, H * 0.08, 0.0034, COL.hillNear);

  // ---- world ----
  ctx.setTransform(SCALE, 0, 0, SCALE, W / 2 - cam.x * SCALE, H / 2 - cam.y * SCALE);
  const x0 = cam.x - W / 2 / SCALE - 40, x1 = cam.x + W / 2 / SCALE + 40, bottom = cam.y + VIEW_H;
  const i0 = segIndex(x0), i1 = Math.min(ground.length - 1, segIndex(x1) + 1);

  // finish banner behind ground line
  drawFinish();
  L.checkpoints.forEach((x, i) => drawFlag(x, groundY(x), run.cpHit[i]));

  ctx.beginPath(); ctx.moveTo(ground[i0].x, Math.max(bottom, ground[i0].y) + 50);
  for (let i = i0; i <= i1; i++) ctx.lineTo(ground[i].x, ground[i].y);
  ctx.lineTo(ground[i1].x, Math.max(bottom, ground[i1].y) + 50); ctx.closePath();
  ctx.fillStyle = getDirtPattern(); ctx.fill();
  ctx.beginPath();
  for (let i = i0; i <= i1; i++) i === i0 ? ctx.moveTo(ground[i].x, ground[i].y) : ctx.lineTo(ground[i].x, ground[i].y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = COL.grass; ctx.lineWidth = 14; ctx.stroke();
  ctx.strokeStyle = COL.grassLight; ctx.lineWidth = 4; ctx.translate(0, -4); ctx.stroke(); ctx.translate(0, 4);

  // stars
  const now = performance.now() / 1000;
  L.stars.forEach(([sx, sh], i) => {
    if (run.stars[i]) return;
    const sy = groundY(sx) - sh + Math.sin(now * 3 + i) * 5;
    drawStar(sx, sy, 16, now * 1.5 + i);
  });

  if (state !== 'menu') drawBike();

  // popups (world-anchored)
  ctx.textAlign = 'center'; ctx.font = `30px ${FONT}`;
  for (const p of run.popups) {
    const a = Math.min(1, 2 - p.t * 1.25);
    ctx.globalAlpha = Math.max(0, a);
    const y = p.y - p.t * 60, s = 1 + Math.max(0, 0.3 - p.t) * 2;
    ctx.save(); ctx.translate(p.x, y); ctx.scale(s, s);
    ctx.lineWidth = 6; ctx.strokeStyle = '#1b2140'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ---- screen UI ----
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const u = H / 620;
  if (state === 'menu') drawMenu(u);
  else drawHUD(u);
  if (state === 'ready') bigText('Press  ↑  to GO!', H * 0.32, 52 * u, '#ffffff', Math.sin(stateT * 5) * 0.05 + 1);
  if (state === 'finish') drawFinishCard(u);
}

function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, 7); ctx.arc(x + 30 * s, y - 12 * s, 32 * s, 0, 7); ctx.arc(x + 64 * s, y, 24 * s, 0, 7);
  ctx.rect(x, y - 2 * s, 64 * s, 26 * s); ctx.fill();
}
function hills(par, baseY, amp, freq, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let sx = 0; sx <= W + 10; sx += 10) {
    const wx = cam.x * par + (sx - W / 2) / SCALE;
    const y = baseY - amp * (0.6 * Math.sin(wx * freq) + 0.4 * Math.sin(wx * freq * 2.3 + 1.7)) - (cam.y - 300) * par * SCALE * 0.15;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function drawStar(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(rot) * 0.3);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = '#ffe066'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#e09b00'; ctx.stroke();
  ctx.restore();
}
function drawFlag(x, gy, hit) {
  ctx.strokeStyle = '#3b3b48'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy - 110); ctx.stroke();
  ctx.fillStyle = hit ? '#5fd35f' : '#ffffff';
  ctx.beginPath(); ctx.moveTo(x, gy - 110); ctx.lineTo(x + 50, gy - 95); ctx.lineTo(x, gy - 80); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1b2140'; ctx.lineWidth = 2; ctx.stroke();
}
function drawFinish() {
  const x = L.finish, gy = groundY(x), h = 230, w = 150;
  ctx.fillStyle = '#3b3b48';
  ctx.fillRect(x - w / 2 - 6, gy - h, 12, h); ctx.fillRect(x + w / 2 - 6, gy - h, 12, h);
  const sq = 15;
  for (let r = 0; r < 3; r++) for (let c = 0; c < w / sq; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#1b2140' : '#ffffff';
    ctx.fillRect(x - w / 2 + c * sq, gy - h + r * sq, sq, sq);
  }
  ctx.font = `30px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 6; ctx.strokeStyle = '#1b2140'; ctx.strokeText('FINISH', x, gy - h - 14); ctx.fillText('FINISH', x, gy - h - 14);
  drawCup(x, gy - h - 70, 0.5, 'gold');
}

function drawBike() {
  const [R, F, Hd] = parts;
  const dx = F.x - R.x, dy = F.y - R.y, len = Math.hypot(dx, dy);
  const d = { x: dx / len, y: dy / len }, up = { x: d.y, y: -d.x };
  const mx = (R.x + F.x) / 2, my = (R.y + F.y) / 2;
  const P = (a, u) => [mx + d.x * a + up.x * u, my + d.y * a + up.y * u];
  const line = (pts, color, wdt) => { ctx.strokeStyle = color; ctx.lineWidth = wdt; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  wheel(R.x, R.y, run.spinR); wheel(F.x, F.y, run.spinF);
  // suspension + frame
  line([[R.x, R.y], P(-6, 24)], COL.frameDark, 6);
  line([[F.x, F.y], P(24, 34)], '#8a93a8', 6);
  ctx.fillStyle = COL.frame; ctx.beginPath();
  [P(-20, 26), P(-2, 34), P(26, 34), P(16, 18), P(-4, 14)].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath(); ctx.fill(); ctx.strokeStyle = COL.frameDark; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#4a4f63'; ctx.beginPath(); const [ex, ey] = P(2, 16); ctx.arc(ex, ey, 8, 0, 7); ctx.fill();   // engine
  line([P(-30, 30), P(-6, 32)], '#2b2b33', 6);                        // seat
  line([P(24, 34), P(20, 44)], '#2b2b33', 4);                          // handlebar

  // rider
  const hip = P(-12, 36), knee = P(8, 28), foot = P(0, 12);
  const head = [Hd.x, Hd.y];
  const shoulder = [hip[0] + (head[0] - hip[0]) * 0.72, hip[1] + (head[1] - hip[1]) * 0.72];
  const hand = P(20, 44), elbow = [(shoulder[0] + hand[0]) / 2 + up.x * 4, (shoulder[1] + hand[1]) / 2 + up.y * 4];
  line([hip, knee, foot], COL.pants, 8);
  line([hip, shoulder], COL.shirt, 11);
  line([shoulder, elbow, hand], COL.shirt, 6);
  // head + helmet
  ctx.fillStyle = COL.helmet; ctx.beginPath(); ctx.arc(head[0], head[1], HR, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c99400'; ctx.lineWidth = 2; ctx.stroke();
  const vis = [head[0] + d.x * 5 + up.x * 1, head[1] + d.y * 5 + up.y * 1];
  ctx.fillStyle = COL.visor; ctx.beginPath(); ctx.ellipse(vis[0], vis[1], 6, 4, Math.atan2(d.y, d.x), 0, 7); ctx.fill();
}
function wheel(x, y, spin) {
  ctx.fillStyle = COL.tire; ctx.beginPath(); ctx.arc(x, y, WR, 0, 7); ctx.fill();
  ctx.fillStyle = '#e9eef7'; ctx.beginPath(); ctx.arc(x, y, WR - 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#8a93a8'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { const a = spin + i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * (WR - 6), y - Math.sin(a) * (WR - 6)); ctx.lineTo(x + Math.cos(a) * (WR - 6), y + Math.sin(a) * (WR - 6)); ctx.stroke(); }
  ctx.fillStyle = COL.frameDark; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
}

function drawCup(x, y, s, kind) {
  const c = { gold: ['#ffd23f', '#d99a00'], silver: ['#e6edf5', '#9aa8b8'], bronze: ['#e39a5a', '#a35d22'] }[kind];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineWidth = 10; ctx.strokeStyle = c[1];
  ctx.beginPath(); ctx.arc(-58, -20, 26, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(58, -20, 26, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  ctx.fillStyle = c[0];
  ctx.beginPath(); ctx.moveTo(-60, -60); ctx.lineTo(60, -60); ctx.quadraticCurveTo(60, 30, 0, 40); ctx.quadraticCurveTo(-60, 30, -60, -60); ctx.fill();
  ctx.fillRect(-10, 38, 20, 30);
  ctx.fillStyle = c[1]; ctx.fillRect(-40, 66, 80, 14); ctx.fillRect(-52, 80, 104, 18);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(-28, -28, 9, 22, 0.15, 0, 7); ctx.fill();
  ctx.restore();
  if (s >= 0.9) { ctx.save(); ctx.translate(x, y - 18 * s); drawStarScreen(0, 0, 20 * s); ctx.restore(); }
}
function drawStarScreen(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
}

function bigText(t, y, size, color, scale = 1) {
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(scale, scale);
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.18; ctx.strokeStyle = '#1b2140'; ctx.lineJoin = 'round'; ctx.strokeText(t, 0, 0);
  ctx.fillStyle = color; ctx.fillText(t, 0, 0); ctx.restore();
}
function pill(x, y, w, h, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
}
function fmtTime(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }

function drawHUD(u) {
  ctx.textBaseline = 'middle'; ctx.font = `${26 * u}px ${FONT}`;
  const items = [['⏱ ' + fmtTime(run.time)], ['⭐ ' + run.starCount + '/' + L.stars.length], ['🔄 ' + (run.backflips + run.frontflips)]];
  let x = 16 * u;
  for (const [t] of items) {
    const w = ctx.measureText(t).width + 30 * u;
    pill(x, 14 * u, w, 44 * u, 'rgba(27,33,64,.72)');
    ctx.fillStyle = '#fff7e6'; ctx.textAlign = 'left'; ctx.fillText(t, x + 15 * u, 37 * u);
    x += w + 10 * u;
  }
  // level name
  ctx.textAlign = 'right'; ctx.fillStyle = '#1b2140'; ctx.font = `${24 * u}px ${FONT}`;
  ctx.fillText(L.name, W - 18 * u, 37 * u);
  // progress bar
  const bw = W * 0.34, bx = W / 2 - bw / 2, by = H - 34 * u;
  pill(bx, by, bw, 14 * u, 'rgba(27,33,64,.55)');
  const prog = Math.max(0, Math.min(1, (center().x - L.startX) / (L.finish - L.startX)));
  pill(bx, by, Math.max(14 * u, bw * prog), 14 * u, '#ffcc33');
  ctx.font = `${22 * u}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#1b2140';
  ctx.fillText('🏁', bx + bw + 18 * u, by + 7 * u);
  if (run.crashed) bigText('Oops! Try again…', H * 0.3, 48 * u, '#ffffff');
}

function drawMenu(u) {
  ctx.fillStyle = 'rgba(27,33,64,.35)'; ctx.fillRect(0, 0, W, H);
  bigText('FLIP RIDER', H * 0.17, 84 * u, '#ffcc33', 1 + Math.sin(stateT * 2) * 0.02);
  const cw = 230 * u, ch = 230 * u, gap = 26 * u, total = LEVELS.length * cw + (LEVELS.length - 1) * gap;
  LEVELS.forEach((lv, i) => {
    const x = W / 2 - total / 2 + i * (cw + gap), y = H * 0.33;
    const on = i === sel, lift = on ? -10 * u + Math.sin(stateT * 4) * 3 * u : 0;
    ctx.fillStyle = on ? '#fff7e6' : 'rgba(255,247,230,.75)';
    ctx.beginPath(); ctx.roundRect(x, y + lift, cw, ch, 22 * u); ctx.fill();
    if (on) { ctx.lineWidth = 6 * u; ctx.strokeStyle = '#ffcc33'; ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff5a36'; ctx.font = `${64 * u}px ${FONT}`; ctx.fillText(String(i + 1), x + cw / 2, y + lift + 58 * u);
    ctx.fillStyle = '#1b2140'; ctx.font = `${26 * u}px ${FONT}`; ctx.fillText(lv.name, x + cw / 2, y + lift + 112 * u);
    const b = best[lv.name];
    if (b) { drawCup(x + cw / 2, y + lift + 160 * u, 0.32 * u, b.cup); ctx.font = `${18 * u}px ${FONT}`; ctx.fillStyle = '#5a6290'; ctx.fillText('Best ' + b.score, x + cw / 2, y + lift + 205 * u); }
    else { ctx.font = `${18 * u}px ${FONT}`; ctx.fillStyle = '#8b92b8'; ctx.fillText('No cup yet', x + cw / 2, y + lift + 175 * u); }
  });
  bigText('←  →  choose      ↑  start', H * 0.86, 34 * u, '#ffffff');
}

function drawFinishCard(u) {
  // confetti
  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x * W, c.y * H); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5 * u, -3 * u, 10 * u, 6 * u); ctx.restore();
    if (c.y > 1.1) { c.y = -0.05; c.vy = Math.random() * 0.2; }
  }
  const t = stateT, fi = finishInfo;
  ctx.fillStyle = `rgba(27,33,64,${Math.min(0.55, t)})`; ctx.fillRect(0, 0, W, H);
  const cw = 520 * u, ch = 470 * u, x = W / 2 - cw / 2, y = H / 2 - ch / 2 + Math.max(0, 1 - t * 3) * 200 * u;
  ctx.fillStyle = '#fff7e6'; ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 28 * u); ctx.fill();
  ctx.lineWidth = 6 * u; ctx.strokeStyle = { gold: '#ffcc33', silver: '#b8c4d4', bronze: '#d08a4a' }[fi.cup]; ctx.stroke();

  const pop = Math.min(1, Math.max(0, (t - 0.3) * 3));
  const s = (0.95 + 0.25 * Math.sin(Math.min(1, pop) * Math.PI)) * u * pop;
  if (pop > 0) drawCup(W / 2, y + 120 * u, s, fi.cup);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${40 * u}px ${FONT}`; ctx.fillStyle = '#1b2140';
  ctx.fillText({ gold: 'GOLD CUP!', silver: 'SILVER CUP!', bronze: 'BRONZE CUP!' }[fi.cup], W / 2, y + 232 * u);

  const count = k => Math.round(fi[k] * Math.min(1, Math.max(0, (t - 0.6) / 1.0)));
  ctx.font = `${24 * u}px ${FONT}`;
  const rows = [['⏱ Time ' + fmtTime(run.time), count('timePts')], ['🔄 Flips  ' + run.backflips + ' back · ' + run.frontflips + ' front', count('flipPts')], ['⭐ Stars ' + run.starCount, count('starPts')]];
  rows.forEach(([lbl, v], i) => {
    const ry = y + (280 + i * 34) * u;
    ctx.textAlign = 'left'; ctx.fillStyle = '#4a5280'; ctx.fillText(lbl, x + 50 * u, ry);
    ctx.textAlign = 'right'; ctx.fillStyle = '#1b2140'; ctx.fillText('+' + v, x + cw - 50 * u, ry);
  });
  ctx.textAlign = 'center'; ctx.font = `${44 * u}px ${FONT}`; ctx.fillStyle = '#ff5a36';
  ctx.fillText('Score ' + (count('timePts') + count('flipPts') + count('starPts')), W / 2, y + 400 * u);
  if (fi.isBest && t > 1.7) { ctx.font = `${20 * u}px ${FONT}`; ctx.fillStyle = '#2e9e45'; ctx.fillText('★ New best! ★', W / 2, y + 438 * u); }
  if (t > 1.5) {
    const next = sel < LEVELS.length - 1 ? '   → next level' : '';
    bigText('↑ again   ← menu' + next, y + ch + 34 * u, 28 * u, '#ffffff');
  }
}

/* ================= main loop ================= */
loadLevel(0);
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
